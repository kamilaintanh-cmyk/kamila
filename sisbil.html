<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f0f2f5;
        }

        .kalkulator {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .hasil {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="kalkulator">

            <h2 class="text-center mb-4">
                Kalkulator Sistem Bilangan
            </h2>

            <!-- Input bilangan -->
            <div class="mb-3">
                <label for="bilangan" class="form-label">
                    Masukkan Bilangan
                </label>

                <input
                    type="text"
                    id="bilangan"
                    class="form-control"
                    placeholder="Contoh: 1010"
                >
            </div>

            <!-- Sistem bilangan asal -->
            <div class="mb-3">
                <label for="asal" class="form-label">
                    Sistem Bilangan Asal
                </label>

                <select id="asal" class="form-select">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10" selected>Desimal (Basis 10)</option>
                    <option value="16">Heksadesimal (Basis 16)</option>
                </select>
            </div>

            <!-- Sistem bilangan tujuan -->
            <div class="mb-4">
                <label for="tujuan" class="form-label">
                    Konversi Ke
                </label>

                <select id="tujuan" class="form-select">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10">Desimal (Basis 10)</option>
                    <option value="16" selected>
                        Heksadesimal (Basis 16)
                    </option>
                </select>
            </div>

            <!-- Tombol konversi -->
            <button
                type="button"
                class="btn btn-primary w-100 mb-4"
                onclick="konversikan()"
            >
                Konversi
            </button>

            <!-- Hasil konversi -->
            <div class="text-center">
                <label class="form-label d-block">
                    Hasil Konversi
                </label>

                <div id="hasil" class="hasil">-</div>

                <div id="pesan" class="text-danger mt-2"></div>
            </div>

        </div>
    </div>

    <script>
        function konversikan() {
            const input = document.getElementById("bilangan")
                .value.trim();

            const asal = parseInt(
                document.getElementById("asal").value
            );

            const tujuan = parseInt(
                document.getElementById("tujuan").value
            );

            const hasil = document.getElementById("hasil");
            const pesan = document.getElementById("pesan");

            // Reset tampilan
            pesan.textContent = "";
            hasil.textContent = "-";

            // Validasi input kosong
            if (input === "") {
                pesan.textContent = "Silakan masukkan bilangan!";
                return;
            }

            // Validasi karakter sesuai sistem bilangan asal
            const pola = {
                2: /^[01]+$/,
                8: /^[0-7]+$/,
                10: /^[0-9]+$/,
                16: /^[0-9a-fA-F]+$/
            };

            if (!pola[asal].test(input)) {
                pesan.textContent =
                    "Bilangan tidak valid untuk basis " + asal + "!";
                return;
            }

            // Konversi ke bilangan desimal (BigInt)
            let desimal;

            try {
                desimal = BigInt(parseInt(asal).toString() === ""
                    ? 0
                    : 0);

                // BigInt mendukung bilangan bulat besar.
                desimal = BigInt(
                    "0x" + BigInt(
                        parseInt(input, asal)
                    ).toString(16)
                );
            } catch (error) {
                pesan.textContent = "Bilangan tidak dapat dikonversi!";
                return;
            }

            // Konversi dari basis asal ke basis tujuan.
            // Gunakan BigInt agar bilangan besar tetap akurat.
            try {
                let nilai = 0n;
                const digit = "0123456789abcdef";

                for (const karakter of input.toLowerCase()) {
                    nilai = nilai * BigInt(asal) +
                        BigInt(digit.indexOf(karakter));
                }

                const hasilKonversi = nilai.toString(tujuan)
                    .toUpperCase();

                hasil.textContent = hasilKonversi;
            } catch (error) {
                pesan.textContent = "Terjadi kesalahan saat konversi.";
            }
        }
    </script>

</body>
</html>
